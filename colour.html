    <style>
        /* CORE DESIGN SYSTEM */
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface-hover: #161616;
            --text-main: #eeeeee;
            --text-dim: #888888;
            --accent: #ffffff;
            --border: #1e1e1e;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        img { display: block; max-width: 100%; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        
        /* NAV */
        nav {
            position: fixed;
            top: 0; width: 100%; height: 80px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        nav .container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .nav-logo { width: 44px; height: auto; }
        .nav-right { display: flex; align-items: center; }
        .nav-links a { color: var(--text-dim); text-decoration: none; text-transform: uppercase; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.15em; margin-left: 2.5rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        .nav-socials { display: flex; gap: 1.2rem; margin-left: 3rem; padding-left: 2rem; border-left: 1px solid #282828; }
        .nav-socials a { color: var(--text-dim); font-size: 1.1rem; transition: 0.3s; }
        .nav-socials a:hover { color: var(--accent); transform: translateY(-2px); }

        /* HEADERS */
        .workflow-headline { font-size: clamp(1.8rem, 4.5vw, 3.2rem); text-transform: uppercase; font-weight: 800; letter-spacing: -0.02em; }
        .work-cat { margin-bottom: 6rem; }
        .work-header { margin-bottom: 1.5rem; border-bottom: 1px solid #2a2a2a; padding-bottom: 0.8rem; scroll-margin-top: 100px; }
        .work-header h2 { font-size: clamp(1.2rem, 2.5vw, 1.8rem); text-transform: uppercase; font-weight: 800; letter-spacing: -0.01em; }

        /* 8-COLUMN GRID SYSTEM */
        .colour-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        @media (min-width: 768px) { .colour-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1024px) { .colour-grid { grid-template-columns: repeat(8, 1fr); } }
        
        .colour-grid img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s ease;
        }
        .colour-grid img:hover { border-color: var(--accent); transform: scale(1.03); z-index: 2; position: relative; }

        /* SHOW MORE LOGIC */
        .colour-grid.collapsed img:nth-child(n+17) {
            display: none;
        }
        .show-more-wrapper {
            text-align: center;
            margin-top: 2.5rem;
        }
        .submit-btn { background: var(--accent); color: #000; border: none; padding: 1.1rem 2.8rem; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; transition: 0.3s; margin-top: 0.5rem; }
        .submit-btn:hover { background: #d0d0d0; }

        /* LIGHTBOX GALLERY */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .lightbox-close, .lightbox-prev, .lightbox-next {
            position: absolute;
            color: #fff;
            background: rgba(20,20,20,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
            border-radius: 50%;
        }
        .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: #fff; color: #000; }
        .lightbox-close { top: 1.5rem; right: 2rem; width: 44px; height: 44px; font-size: 1.2rem; }
        .lightbox-prev { left: 2rem; width: 50px; height: 50px; font-size: 1.2rem; }
        .lightbox-next { right: 2rem; width: 50px; height: 50px; font-size: 1.2rem; }

        /* FOOTER */
        footer { padding: 120px 0 80px; text-align: center; border-top: 1px solid var(--border); margin-top: 80px; }
        .footer-logo { width: 55px; margin: 0 auto 2rem; opacity: 0.8; }
        .footer-socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5rem; }
        .social-btn { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; transition: 0.3s; padding: 0.75rem 1.4rem; border: 1px solid var(--border); }
        .social-btn:hover { color: var(--accent); border-color: #444; background: var(--surface); }

        @media (max-width: 768px) {
            .nav-links, .nav-socials { display: none; }
            .lightbox-prev { left: 0.5rem; width: 40px; height: 40px; }
            .lightbox-next { right: 0.5rem; width: 40px; height: 40px; }
            .lightbox-img { max-width: 100%; }
        }
    </style>
</head>

    <!-- LOGIC -->
    <script>
        // --- Show More / Hide Stills Logic ---
        function toggleGallery(gridId, btn) {
            const grid = document.getElementById(gridId);
            
            if (grid.classList.contains('collapsed')) {
                // Expand the grid
                grid.classList.remove('collapsed');
                btn.innerText = 'Show Less Stills';
            } else {
                // Collapse the grid and scroll back to the header
                grid.classList.add('collapsed');
                btn.innerText = 'Show More Stills';
                
                const header = grid.previousElementSibling;
                header.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // --- Lightbox Gallery Logic ---
        let currentGallery = [];
        let currentIndex = 0;
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(imgElement) {
            const grid = imgElement.closest('.colour-grid');
            // Grabs all images in the grid, even the hidden ones!
            currentGallery = Array.from(grid.querySelectorAll('img'));
            currentIndex = currentGallery.indexOf(imgElement);
            
            lightboxImg.src = imgElement.src;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            document.body.style.overflow = ''; 
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = currentGallery.length - 1;
            if (currentIndex >= currentGallery.length) currentIndex = 0;
            lightboxImg.src = currentGallery[currentIndex].src;
        }

        document.addEventListener('keydown', (e) => {
            if (lightbox.style.display === 'flex') {
                if (e.key === 'ArrowRight') changeImage(1);
                if (e.key === 'ArrowLeft') changeImage(-1);
                if (e.key === 'Escape') closeLightbox();
            }
        });
    </script>
